# Local-only MongoDB fixture for the tech-partnerships migration demos.
services:
  tp-mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - tp-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tp-mongodb-data:
