# Karpenter node capacity for the shared workshop cluster.
#
# Placeholders are substituted by demo-platform/scripts/install-karpenter.sh
# from Terraform outputs: __CLUSTER__, __INSTANCE_PROFILE__.
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Subnets and security group are found by the karpenter.sh/discovery tag that
  # Terraform puts on them, so a rebuilt VPC needs no change here.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER__
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER__
  amiSelectorTerms:
    - alias: al2023@latest
  # Created by Terraform rather than by Karpenter, which is why the controller
  # holds no IAM write permissions.
  instanceProfile: __INSTANCE_PROFILE__
  # The cluster runs without a NAT gateway (deliberately -- it would cost more
  # than the public addresses do), so nodes reach ECR and the API over a public
  # IP. Same arrangement the managed node group already uses.
  associatePublicIPAddress: true
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 60Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: otterworks
    ManagedBy: karpenter
    Layer: platform
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: tenants
spec:
  template:
    metadata:
      labels:
        otterworks.io/pool: tenants
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Spot only. Tenant workloads are demos: a reclaim costs a reschedule,
        # and the interruption queue gives Karpenter the two-minute warning to
        # drain and replace ahead of one.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        # Big enough to bin-pack a tenant's ~15 small pods without stranding
        # capacity, small enough that losing one node to a Spot reclaim takes a
        # bounded number of tenants with it.
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]
      # Replace nodes weekly so they pick up patched AMIs; without this a
      # long-lived workshop cluster drifts.
      expireAfter: 168h
  disruption:
    # The other half of the reaper's idle scale-to-zero: once a tenant's pods
    # are gone the node they were on is empty, and this is what stops it
    # billing. Underutilized nodes are also replaced with smaller ones as
    # tenants come and go, which is where most of the saving at low occupancy
    # comes from.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      # Cap voluntary churn so consolidation cannot drain a large share of the
      # cluster at once during a workshop.
      - nodes: "20%"
  # Ceiling on what this pool can ever launch -- roughly 100 awake tenants at
  # the measured ~4 vCPU each, and a hard stop on a runaway loop provisioning
  # the account into the ground. Concurrency is governed before this by the
  # dashboard's checkout cap and the idle suspend.
  limits:
    cpu: "400"
    memory: 1600Gi
