resources:
  jobs:
    ow_tp_cronbox_bootstrap:
      name: ow_tp_cronbox_bootstrap
      max_concurrent_runs: 1
      tasks:
        - task_key: ensure_unity_catalog
          sql_task:
            file:
              path: ../src/bootstrap.sql
            warehouse_id: ${var.sql_warehouse_id}

    ow_tp_cron_analytics_daily:
      name: ow_tp_cron_analytics_daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: ns
          default: demo
        - name: ds
          default: "{{job.trigger.time.iso_date}}"
      tasks:
        - task_key: analytics_00_ddl_bronze_raw
          sql_task:
            file: {path: ../src/analytics/00_ddl_bronze_raw.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_01_ddl_bronze_rejected
          depends_on: [{task_key: analytics_00_ddl_bronze_raw}]
          sql_task:
            file: {path: ../src/analytics/01_ddl_bronze_rejected.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_02_ddl_silver
          depends_on: [{task_key: analytics_01_ddl_bronze_rejected}]
          sql_task:
            file: {path: ../src/analytics/02_ddl_silver.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_03_ddl_gold_summary
          depends_on: [{task_key: analytics_02_ddl_silver}]
          sql_task:
            file: {path: ../src/analytics/03_ddl_gold_summary.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_04_ddl_gold_top_users
          depends_on: [{task_key: analytics_03_ddl_gold_summary}]
          sql_task:
            file: {path: ../src/analytics/04_ddl_gold_top_users.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_05_ddl_gold_hourly
          depends_on: [{task_key: analytics_04_ddl_gold_top_users}]
          sql_task:
            file: {path: ../src/analytics/05_ddl_gold_hourly.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_06_ddl_gold_report_view
          depends_on: [{task_key: analytics_05_ddl_gold_hourly}]
          sql_task:
            file: {path: ../src/analytics/06_ddl_gold_report_view.sql}
            warehouse_id: ${var.sql_warehouse_id}
        - task_key: analytics_10_bronze_ingest
          depends_on: [{task_key: analytics_06_ddl_gold_report_view}]
          sql_task:
            file: {path: ../src/analytics/10_bronze_ingest.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_20_bronze_reject
          depends_on: [{task_key: analytics_10_bronze_ingest}]
          sql_task:
            file: {path: ../src/analytics/20_bronze_reject.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_30_silver
          depends_on: [{task_key: analytics_20_bronze_reject}]
          sql_task:
            file: {path: ../src/analytics/30_silver.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_40_gold_summary
          depends_on: [{task_key: analytics_30_silver}]
          sql_task:
            file: {path: ../src/analytics/40_gold_summary.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_50_gold_top_users_prune
          depends_on: [{task_key: analytics_40_gold_summary}]
          sql_task:
            file: {path: ../src/analytics/50_gold_top_users_prune.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_51_gold_top_users_publish
          depends_on: [{task_key: analytics_50_gold_top_users_prune}]
          sql_task:
            file: {path: ../src/analytics/51_gold_top_users_publish.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_60_gold_hourly_prune
          depends_on: [{task_key: analytics_51_gold_top_users_publish}]
          sql_task:
            file: {path: ../src/analytics/60_gold_hourly_prune.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}
        - task_key: analytics_61_gold_hourly_publish
          depends_on: [{task_key: analytics_60_gold_hourly_prune}]
          sql_task:
            file: {path: ../src/analytics/61_gold_hourly_publish.sql}
            warehouse_id: ${var.sql_warehouse_id}
            parameters: {ns: "{{job.parameters.ns}}", ds: "{{job.parameters.ds}}"}

    ow_tp_cron_user_activity_daily:
      name: ow_tp_cron_user_activity_daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: user_activity_placeholder
          sql_task:
            file:
              path: ../src/user_activity_placeholder.sql
            warehouse_id: ${var.sql_warehouse_id}
