sonar.projectKey=Cognition-Partner-Workshops_otterworks
sonar.projectName=OtterWorks
sonar.organization=cognition-partner-workshops

# Polyglot monorepo — 12 backend services + 2 frontends
sonar.sources=services,frontend
sonar.sourceEncoding=UTF-8

# Skip compiled-class requirement for Java (no build step in CI scan)
sonar.java.binaries=.

# Exclude build artifacts, dependencies, and generated files. Test sources are
# excluded here too: they are indexed via sonar.tests below, and a file that
# matches both sonar.sources and sonar.tests is counted as main code, which is
# what previously inflated this project's "lines of code" and deflated its
# coverage. Keep sonar.exclusions and sonar.test.inclusions in sync.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.gradle/**,\
  **/coverage/**,\
  **/coverage-reports/**,\
  **/__pycache__/**,\
  **/vendor/**,\
  **/bin/**,\
  **/obj/**,\
  infrastructure/**,\
  scripts/**,\
  tests/**,\
  **/*.lock,\
  **/package-lock.json,\
  **/Cargo.lock,\
  **/poetry.lock,\
  **/Gemfile.lock,\
  **/*_test.go,\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/tests/**,\
  **/__tests__/**,\
  **/test/**,\
  **/spec/**,\
  **/e2e/**,\
  **/bdd/**

# Test directories
sonar.tests=services,frontend
sonar.test.inclusions=\
  **/*_test.go,\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/tests/**,\
  **/__tests__/**,\
  **/test/**,\
  **/spec/**

# Coverage reports, as produced by `make test-coverage` /
# scripts/coverage/run-unit.sh. Paths that are absent on a given run are
# skipped with a warning rather than failing the scan.
sonar.go.coverage.reportPaths=coverage-reports/api-gateway/coverage.out
sonar.python.coverage.reportPaths=\
  coverage-reports/document-service/coverage.xml,\
  coverage-reports/search-service/coverage.xml
sonar.coverage.jacoco.xmlReportPaths=\
  coverage-reports/auth-service/jacocoTestReport.xml,\
  coverage-reports/notification-service/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=\
  coverage-reports/collab-service/lcov.info,\
  coverage-reports/client-app/lcov.info,\
  coverage-reports/admin-dashboard/lcov.info
sonar.typescript.lcov.reportPaths=\
  coverage-reports/collab-service/lcov.info,\
  coverage-reports/client-app/lcov.info,\
  coverage-reports/admin-dashboard/lcov.info
