sonar.projectKey=Cognition-Partner-Workshops_otterworks
sonar.projectName=OtterWorks
sonar.organization=cognition-partner-workshops

# Polyglot monorepo — 11 backend services + 2 frontends.
#
# sonar.sources and sonar.tests must be disjoint: a file claimed by both is
# reported as an error and Sonar silently drops one classification, which is why
# test code was being measured as production code (and production code as
# tests). The roots stay the same; sonar.exclusions below carves the test files
# out of sources, and sonar.test.inclusions carves the same set into tests.
sonar.sources=services,frontend
sonar.sourceEncoding=UTF-8

# Skip compiled-class requirement for Java (no build step in CI scan)
sonar.java.binaries=.

# Exclude build artifacts, dependencies, generated files -- and every test file,
# so that sources and tests do not overlap. Keep the test half of this list
# identical to sonar.test.inclusions below.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.gradle/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/vendor/**,\
  **/bin/**,\
  **/obj/**,\
  infrastructure/**,\
  scripts/**,\
  tests/**,\
  **/*.lock,\
  **/package-lock.json,\
  **/Cargo.lock,\
  **/poetry.lock,\
  **/Gemfile.lock,\
  **/*_test.go,\
  **/test_*.py,\
  **/*_spec.rb,\
  **/*Test.java,\
  **/*Tests.java,\
  **/*Test.kt,\
  **/*Spec.scala,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/__tests__/**,\
  **/test/**,\
  **/spec/**

# Test files. Same set as the test half of sonar.exclusions -- these are indexed
# as tests instead of being dropped.
sonar.tests=services,frontend
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.gradle/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/vendor/**,\
  **/bin/**,\
  **/obj/**
sonar.test.inclusions=\
  **/*_test.go,\
  **/test_*.py,\
  **/*_spec.rb,\
  **/*Test.java,\
  **/*Tests.java,\
  **/*Test.kt,\
  **/*Spec.scala,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/__tests__/**,\
  **/test/**,\
  **/spec/**

# Coverage reports, produced by `make test-coverage` / the CI unit jobs and
# collected into coverage/<unit>/ by scripts/coverage/run-coverage.sh.
sonar.go.coverage.reportPaths=coverage/api-gateway/coverage.out
sonar.python.coverage.reportPaths=coverage/document-service/coverage.xml,coverage/search-service/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/collab-service/lcov.info,coverage/client-app/lcov.info,coverage/admin-dashboard/lcov.info
sonar.typescript.lcov.reportPaths=coverage/collab-service/lcov.info,coverage/client-app/lcov.info,coverage/admin-dashboard/lcov.info
# Not `sonar.coverageReportPaths`: that is the Generic Test Coverage importer,
# which does not read Cobertura. C# is imported as OpenCover and Scala as
# scoverage.xml; run-coverage.sh collects both into the unit's `sonar/` subdir.
sonar.cs.opencover.reportsPaths=coverage/audit-service/sonar/coverage.opencover.xml
sonar.scala.coverage.reportPaths=coverage/analytics-service/sonar/scoverage.xml
sonar.coverage.jacoco.xmlReportPaths=\
  coverage/auth-service/jacocoTestReport.xml,\
  coverage/notification-service/jacocoTestReport.xml,\
  coverage/report-service/jacoco.xml,\
  coverage/legacy-portal/jacoco.xml
