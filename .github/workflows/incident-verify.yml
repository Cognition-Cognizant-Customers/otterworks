name: Incident Harness

# Incident reproduction and verification: stand the app up, inject each seeded
# chaos scenario, prove the probe reproduces the symptom (FAIL), clear the
# flags, and prove verification passes (PASS). This gates the harness itself —
# a probe that cannot tell an injected incident from a healthy stack is broken.

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'incidents/**'
      - '.github/workflows/incident-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incident-harness:
    name: Inject, probe, verify each scenario
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Start the application stack
        run: |
          docker compose -f docker-compose.infra.yml -f docker-compose.yml up -d --build \
            postgres redis localstack meilisearch \
            auth-service api-gateway admin-service \
            search-service file-service document-service notification-service

      - name: Wait for the API gateway
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "API gateway never became healthy"
          docker compose -f docker-compose.infra.yml -f docker-compose.yml logs --tail=50
          exit 1

      - name: Probe then verify every scenario
        run: |
          set -u
          scenarios="$(uv run --with pyyaml python -c "
          import yaml
          for s in yaml.safe_load(open('incidents/scenarios.yaml'))['scenarios']:
              print(s['id'])
          ")"
          # Every invocation gets its own report directory (and the directory
          # is removed first), so a failing scenario's evidence is preserved
          # in the artifact and a run that dies before writing a report can
          # never be mistaken for a stale one from an earlier iteration.
          verdict_of() {
            uv run python -c "
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1]) / 'incident-report.json'
          r = json.loads(p.read_text()) if p.exists() else {'results': []}
          print(r['results'][0]['status'] if r['results'] else 'MISSING')
          " "$1"
          }
          rc=0
          for scenario in $scenarios; do
            echo "::group::$scenario"
            slug="${scenario//:/-}"
            probe_dir="incidents/reports/$slug/probe"
            verify_dir="incidents/reports/$slug/verify"
            rm -rf "$probe_dir" "$verify_dir"
            make incident-inject SCENARIO="$scenario"
            # While the incident is live the probe must reproduce it: a FAIL
            # verdict in the report. Anything else — PASS, or an INCONCLUSIVE
            # run that proved nothing — fails the gate. The report is checked
            # rather than the exit status because make collapses every recipe
            # failure to exit 2, erasing the FAIL (1) vs INCONCLUSIVE (3)
            # distinction.
            make incident-probe SCENARIO="$scenario" INCIDENT_REPORT_DIR="$probe_dir" || true
            verdict="$(verdict_of "$probe_dir")"
            if [[ "$verdict" != "FAIL" ]]; then
              echo "::error::$scenario: probe reported $verdict instead of FAIL while the flag was set"
              rc=1
            fi
            make incident-reset
            # With the flag cleared verification must pass: a PASS verdict.
            make incident-verify SCENARIO="$scenario" INCIDENT_REPORT_DIR="$verify_dir" || true
            verdict="$(verdict_of "$verify_dir")"
            if [[ "$verdict" != "PASS" ]]; then
              echo "::error::$scenario: verify reported $verdict instead of PASS after the flag was cleared"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Publish the reports
        if: always()
        run: |
          [ -d incidents/reports ] || exit 0
          find incidents/reports -name incident-report.md | sort | while read -r report; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: incident-report
          path: incidents/reports/

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f docker-compose.infra.yml -f docker-compose.yml logs --tail=200
