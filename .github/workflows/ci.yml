name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/workshop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      file-service: ${{ steps.changes.outputs.file-service }}
      document-service: ${{ steps.changes.outputs.document-service }}
      collab-service: ${{ steps.changes.outputs.collab-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      search-service: ${{ steps.changes.outputs.search-service }}
      analytics-service: ${{ steps.changes.outputs.analytics-service }}
      admin-service: ${{ steps.changes.outputs.admin-service }}
      audit-service: ${{ steps.changes.outputs.audit-service }}
      web-app: ${{ steps.changes.outputs.web-app }}
      admin-dashboard: ${{ steps.changes.outputs.admin-dashboard }}
      demo-platform: ${{ steps.changes.outputs.demo-platform }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      report-service: ${{ steps.changes.outputs.report-service }}
      legacy-portal: ${{ steps.changes.outputs.legacy-portal }}
      api-tests: ${{ steps.changes.outputs.api-tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            file-service:
              - 'services/file-service/**'
            document-service:
              - 'services/document-service/**'
            collab-service:
              - 'services/collab-service/**'
            notification-service:
              - 'services/notification-service/**'
            search-service:
              - 'services/search-service/**'
            analytics-service:
              - 'services/analytics-service/**'
            admin-service:
              - 'services/admin-service/**'
            audit-service:
              - 'services/audit-service/**'
            web-app:
              - 'frontend/client-app/**'
            admin-dashboard:
              - 'frontend/admin-dashboard/**'
            demo-platform:
              - 'demo-platform/**'
              - 'scripts/**'
            infrastructure:
              - 'infrastructure/**'
            report-service:
              - 'services/report-service/**'
            legacy-portal:
              - 'services/legacy-portal/**'
            api-tests:
              - 'tests/api/**'
              - 'docs/api-route-matrix.md'
              - 'services/api-gateway/internal/config/**'
              - 'docker-compose*.yml'
              - 'Makefile'

  # Go - API Gateway
  api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - id: test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - run: go build -o /dev/null ./cmd/server
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/api-gateway
          echo goprofile > ../../coverage/api-gateway/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/api-gateway/status.txt
          cp coverage.out ../../coverage/api-gateway/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api-gateway
          path: coverage/api-gateway
          if-no-files-found: warn

  # Java - Auth Service
  auth-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - id: test
        run: gradle check jacocoTestReport --no-daemon
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/auth-service
          echo jacoco > ../../coverage/auth-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/auth-service/status.txt
          cp build/reports/jacoco/test/jacocoTestReport.xml ../../coverage/auth-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-auth-service
          path: coverage/auth-service
          if-no-files-found: warn

  # Rust - File Service
  file-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.file-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/file-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - id: test
        run: cargo llvm-cov --lcov --output-path lcov.info
      - run: cargo build --release
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/file-service
          echo lcov > ../../coverage/file-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/file-service/status.txt
          cp lcov.info ../../coverage/file-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-file-service
          path: coverage/file-service
          if-no-files-found: warn

  # Python - Document Service
  document-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.document-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/document-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry==1.8.2
      - run: poetry install
      - run: poetry run ruff check .
      - id: test
        run: poetry run pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/document-service
          echo cobertura > ../../coverage/document-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/document-service/status.txt
          cp coverage.xml ../../coverage/document-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-document-service
          path: coverage/document-service
          if-no-files-found: warn

  # Node.js - Collaboration Service
  collab-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.collab-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collab-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - id: test
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov
      - run: npm run build
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/collab-service
          echo lcov > ../../coverage/collab-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/collab-service/status.txt
          cp coverage/lcov.info ../../coverage/collab-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-collab-service
          path: coverage/collab-service
          if-no-files-found: warn

  # Kotlin - Notification Service
  notification-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - id: test
        run: gradle check jacocoTestReport --no-daemon
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/notification-service
          echo jacoco > ../../coverage/notification-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/notification-service/status.txt
          cp build/reports/jacoco/test/jacocoTestReport.xml ../../coverage/notification-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-notification-service
          path: coverage/notification-service
          if-no-files-found: warn

  # Python - Search Service
  search-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.search-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/search-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - id: test
        run: python -m pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/search-service
          echo cobertura > ../../coverage/search-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/search-service/status.txt
          cp coverage.xml ../../coverage/search-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-search-service
          path: coverage/search-service
          if-no-files-found: warn

  # Scala - Analytics Service
  analytics-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y sbt
      - run: sbt compile
      - id: test
        run: sbt coverage test coverageReport
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/analytics-service
          echo cobertura > ../../coverage/analytics-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/analytics-service/status.txt
          cp target/scala-*/coverage-report/cobertura.xml ../../coverage/analytics-service/ 2>/dev/null || true
          # Sonar reads Scala coverage as scoverage.xml, not Cobertura.
          mkdir -p ../../coverage/analytics-service/sonar
          cp target/scala-*/scoverage-report/scoverage.xml ../../coverage/analytics-service/sonar/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-analytics-service
          path: coverage/analytics-service
          if-no-files-found: warn

  # Ruby - Admin Service
  admin-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: otterworks
          POSTGRES_PASSWORD: otterworks
          POSTGRES_DB: admin_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/admin-service
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: otterworks
      DATABASE_PASSWORD: otterworks
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: services/admin-service
      - run: bundle exec rails db:schema:load
      - id: test
        run: bundle exec rspec
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/admin-service
          echo simplecov > ../../coverage/admin-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/admin-service/status.txt
          cp coverage/.last_run.json ../../coverage/admin-service/last_run.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-admin-service
          path: coverage/admin-service
          if-no-files-found: warn

  # C# - Audit Service
  audit-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.audit-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audit-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/AuditService.Tests
      - run: dotnet build tests/AuditService.Tests --no-restore
      # The test project must be named: a bare `dotnet test` here resolves to
      # AuditService.csproj (the web app, not a test project) and exits 0 having
      # run none of the 24 xUnit tests.
      # Cobertura feeds the aggregate table; OpenCover is the only .NET format
      # Sonar imports.
      - id: test
        run: dotnet test tests/AuditService.Tests --no-build --collect:"XPlat Code Coverage;Format=cobertura,opencover" --results-directory TestResults
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/audit-service
          echo cobertura > ../../coverage/audit-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/audit-service/status.txt
          cp "$(find TestResults -name coverage.cobertura.xml -print -quit)" ../../coverage/audit-service/ 2>/dev/null || true
          mkdir -p ../../coverage/audit-service/sonar
          cp "$(find TestResults -name coverage.opencover.xml -print -quit)" ../../coverage/audit-service/sonar/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-audit-service
          path: coverage/audit-service
          if-no-files-found: warn

  # React/Next.js - Web App
  web-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      # `--passWithNoTests` is still in the npm script: 4 unit tests over 9.3 KLOC
      # means this job cannot fail today. Removing it is WP-14's call, not this
      # job's, so that the two changes do not collide.
      - id: test
        run: npm test -- --coverage --coverage.reporter=text-summary --coverage.reporter=lcov
      - run: npm run build
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/client-app
          echo lcov > ../../coverage/client-app/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/client-app/status.txt
          cp coverage/lcov.info ../../coverage/client-app/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-client-app
          path: coverage/client-app
          if-no-files-found: warn

  # Angular - Admin Dashboard
  admin-dashboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin-dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # The `|| true`s here make this job unfailable. Removing them is WP-16's
      # call (it has to fix whatever they are currently hiding); this job only
      # adds the coverage measurement.
      - run: npm run lint || true
      # `|| true` would make outcome always 'success', so the real exit code is
      # captured instead: the table tells the truth while the job stays green.
      - id: test
        run: |
          set +e
          npm test -- --browsers=ChromeHeadlessNoSandbox --code-coverage
          echo "status=$?" >>"$GITHUB_OUTPUT"
      - run: npm run build
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/admin-dashboard
          echo lcov > ../../coverage/admin-dashboard/format.txt
          status="${{ steps.test.outputs.status }}"
          echo "${status:-1}" > ../../coverage/admin-dashboard/status.txt
          cp coverage/admin-dashboard/lcov.info ../../coverage/admin-dashboard/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-admin-dashboard
          path: coverage/admin-dashboard
          if-no-files-found: warn

  # Java 8 / Maven - Report Service (LEGACY)
  report-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.report-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/report-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: mvn compile -B -q
      - id: test
        run: mvn test -B
      - run: mvn package -DskipTests -B -q
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/report-service
          echo jacoco > ../../coverage/report-service/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/report-service/status.txt
          cp target/site/jacoco/jacoco.xml ../../coverage/report-service/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-service
          path: coverage/report-service
          if-no-files-found: warn

  # Java 11 / Maven - Legacy Portal. Uses the checked-in wrapper rather than the
  # runner's mvn: the portal builds on Spring Boot 2.x and pins its own Maven.
  legacy-portal:
    needs: detect-changes
    if: needs.detect-changes.outputs.legacy-portal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/legacy-portal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - id: test
        run: ./mvnw test -B
      - name: Stage coverage report
        if: always()
        run: |
          mkdir -p ../../coverage/legacy-portal
          echo jacoco > ../../coverage/legacy-portal/format.txt
          if [ "${{ steps.test.outcome }}" = success ]; then echo 0; else echo 1; fi > ../../coverage/legacy-portal/status.txt
          cp target/site/jacoco/jacoco.xml ../../coverage/legacy-portal/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-legacy-portal
          path: coverage/legacy-portal
          if-no-files-found: warn

  # Terraform validation
  infrastructure:
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # The tenant control plane: dashboard typecheck/lint, plus the shell tests for
  # the reaper and idle-suspend. Those two decide what gets deleted and what gets
  # scaled to zero, and both fail silently by nature -- a tenant that is never
  # examined looks exactly like one that was correctly left alone.
  demo-platform:
    needs: detect-changes
    if: needs.detect-changes.outputs.demo-platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demo-platform/dashboard/package-lock.json
      - run: npm ci
        working-directory: demo-platform/dashboard
      - run: npm run typecheck
        working-directory: demo-platform/dashboard
      - run: npm run lint
        working-directory: demo-platform/dashboard
      # Scoped to the control plane. `scripts/` has a backlog of findings that
      # would make this gate permanently red, and so ignored; widen it once
      # that is cleared.
      - run: shellcheck demo-platform/reaper/*.sh demo-platform/scripts/*.sh demo-platform/lib/*.sh demo-platform/runner/entrypoint.sh
      - run: ./demo-platform/reaper/test-reaper.sh
      - run: ./demo-platform/reaper/test-idle-suspend.sh
      - run: ./demo-platform/reaper/test-infra-sweep.sh
      - run: ./demo-platform/reaper/test-orphan-sweep.sh

  # Terraform validation for the demo control plane's own stack
  demo-platform-terraform:
    needs: detect-changes
    if: needs.detect-changes.outputs.demo-platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-platform/infra/terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.7.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Black-box API flow test validation
  api-flow-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-tests == 'true' || needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/api/requirements.txt
      - run: python -m py_compile tests/api/*.py
      # Collect-only: these 24 flows are syntax-checked, never executed. Standing
      # up a composed stack so they actually run is WP-17.
      - run: python -m pytest tests/api --collect-only -q

  # Aggregate every unit's coverage artifact into one table, publish it on the
  # PR, and enforce the ratchet. This is the job that makes coverage a number
  # anyone can act on: before it, four suites produced coverage and zero gated
  # on it, so no change could be scored.
  #
  # `if: always()` because the unit jobs above are path-filtered -- on a typical
  # PR most of them are skipped, and a skipped job must not skip the report.
  coverage-report:
    needs:
      - api-gateway
      - auth-service
      - file-service
      - document-service
      - collab-service
      - notification-service
      - search-service
      - analytics-service
      - admin-service
      - audit-service
      - web-app
      - admin-dashboard
      - report-service
      - legacy-portal
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          # Per-unit artifacts only. This job's own output is uploaded under a
          # name outside this pattern so a re-run does not ingest it as a unit.
          pattern: coverage-*
          path: artifacts
      - name: Normalise artifact layout
        run: |
          mkdir -p coverage
          shopt -s nullglob
          for dir in artifacts/coverage-*; do
            mv "$dir" "coverage/$(basename "$dir" | sed 's/^coverage-//')"
          done
          find coverage -type f | sort
      - name: Aggregate
        id: aggregate
        run: |
          scripts/coverage/aggregate.py \
            --coverage-dir coverage \
            --markdown coverage/summary.md \
            --json coverage/summary.json
          {
            echo "## Coverage by build unit"
            echo ""
            echo "_Units absent from this table were not rebuilt by this PR (CI is path-filtered)._"
            echo ""
            tail -n +3 coverage/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-coverage-summary
          path: |
            coverage/summary.md
            coverage/summary.json
      - name: Publish coverage table on the PR
        if: github.event_name == 'pull_request'
        # A fork PR's GITHUB_TOKEN is read-only whatever this job declares, so
        # commenting 403s there. The table is already in the step summary, and
        # failing to publish it must not skip the gate below.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- otterworks-coverage-report -->';
            const table = fs.readFileSync('coverage/summary.md', 'utf8');
            const body = `${marker}\n${table}\n\n_Units absent from this table were not rebuilt by this PR (CI is path-filtered). Baseline: \`coverage-baseline.json\`._`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
      - name: Coverage ratchet
        if: always()
        run: scripts/coverage/ratchet.py --summary coverage/summary.json --baseline coverage-baseline.json
      # Codecov is optional: the upload is skipped entirely when no token is
      # configured, so a fork or a token-less org still gets the table above.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          directory: coverage
          fail_ci_if_error: false
