name: SAST Auto-Remediation

# Event-driven security pipeline with two trigger paths:
#
#   1. Trivy (pull_request):
#      PR opened by human → Trivy fs scan → findings? → Devin v3 API session
#      on the same branch → fix pushed → synchronize event re-scans.
#      After MAX_FIX_ATTEMPTS unsuccessful cycles, a GitHub Issue is opened
#      for human review.
#
#   2. SonarCloud (check_run):
#      SonarQube Cloud GitHub app posts a completed check_run → quality gate
#      failed? → validate PR is open + human-authored → one-time Devin v3 API
#      remediation session with the SonarCloud dashboard link.
#
# Bot-loop prevention: both paths skip PRs authored by devin-ai-integration[bot].

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

env:
  TRIVY_VERSION: "0.71.0"
  MAX_FIX_ATTEMPTS: 2
  SEVERITY_THRESHOLD: "CRITICAL,HIGH"
  DEVIN_API_BASE: "https://api.devin.ai"
  DEVIN_ORG_ID: "org-9d35f03b68c64253b53de2a8ea69a691"
  DEVIN_APP_URL: "https://partner-workshops.devinenterprise.com"
  SONAR_PROJECT_KEY: "Cognition-Partner-Workshops_otterworks"

# ─────────────────────────────────────────────────────────────
#  Path 1: Trivy dependency scan (pull_request trigger)
# ─────────────────────────────────────────────────────────────

jobs:
  sast-scan:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'devin-ai-integration[bot]'
    runs-on: ubuntu-latest
    outputs:
      has_findings: ${{ steps.parse.outputs.has_findings }}
      findings_summary: ${{ steps.parse.outputs.findings_summary }}
      attempt_count: ${{ steps.counter.outputs.attempt_count }}
      exceeded_max: ${{ steps.counter.outputs.exceeded_max }}
    steps:
      - uses: actions/checkout@v4

      - name: Count prior fix attempts
        id: counter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ATTEMPT_COUNT=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits?per_page=100" \
            --jq '[.[] | select(.author.login == "devin-ai-integration[bot]")] | length')
          echo "attempt_count=${ATTEMPT_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$ATTEMPT_COUNT" -ge "${{ env.MAX_FIX_ATTEMPTS }}" ]; then
            echo "exceeded_max=true" >> "$GITHUB_OUTPUT"
          else
            echo "exceeded_max=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v${{ env.TRIVY_VERSION }}

      - name: Run Trivy filesystem scan
        run: |
          trivy fs . \
            --severity "${{ env.SEVERITY_THRESHOLD }}" \
            --format json \
            --output trivy-results.json \
            --skip-dirs services/report-service \
            --ignorefile .trivyignore \
            || true

      - name: Parse findings
        id: parse
        run: |
          VULN_COUNT=$(jq '[.Results[]? | .Vulnerabilities // [] | length] | add // 0' trivy-results.json)
          echo "Total HIGH/CRITICAL findings: $VULN_COUNT"

          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "findings_summary=No HIGH or CRITICAL vulnerabilities found." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_findings=true" >> "$GITHUB_OUTPUT"

          # Build a compact summary (service → CVE list) for the PR comment
          # and the Devin prompt. Truncate to 3000 chars for GHA output limits.
          SUMMARY=$(jq -r '
            [.Results[] |
              select((.Vulnerabilities // []) | length > 0) |
              {
                target: .Target,
                vulns: [.Vulnerabilities[] | {
                  id: .VulnerabilityID,
                  pkg: .PkgName,
                  installed: .InstalledVersion,
                  fixed: (.FixedVersion // "n/a"),
                  severity: .Severity,
                  title: .Title
                }]
              }
            ] |
            map("### \(.target)\n" +
              (.vulns | map("- **\(.severity)** `\(.id)`: \(.pkg) \(.installed) → \(.fixed) — \(.title)") | join("\n"))
            ) | join("\n\n")
          ' trivy-results.json | head -c 3000)

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "findings_summary<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Upload scan artifact
        if: steps.parse.outputs.has_findings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 7

  comment-findings:
    needs: sast-scan
    if: needs.sast-scan.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post findings to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS_SUMMARY: ${{ needs.sast-scan.outputs.findings_summary }}
          ATTEMPT_COUNT: ${{ needs.sast-scan.outputs.attempt_count }}
          MAX_ATTEMPTS: ${{ env.MAX_FIX_ATTEMPTS }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="## :shield: SAST Scan — Findings Detected

          Trivy found **HIGH/CRITICAL** vulnerabilities on this PR.

          ${FINDINGS_SUMMARY}

          ---
          **Remediation attempt:** ${ATTEMPT_COUNT} / ${MAX_ATTEMPTS}"

          gh api \
            "repos/${REPO}/issues/${PR_NUM}/comments" \
            -f body="$BODY"

  trigger-devin:
    needs: sast-scan
    if: |
      needs.sast-scan.outputs.has_findings == 'true' &&
      needs.sast-scan.outputs.exceeded_max == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Create Devin remediation session (Trivy findings)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          BRANCH: ${{ github.head_ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FINDINGS_SUMMARY: ${{ needs.sast-scan.outputs.findings_summary }}
          ATTEMPT_COUNT: ${{ needs.sast-scan.outputs.attempt_count }}
        run: |
          PROMPT="You are remediating SAST (Trivy) findings on the repository ${REPO}.

          Check out the existing branch \`${BRANCH}\` (the head branch of PR #${PR_NUM}) and push your fixes to that SAME branch. Do NOT open a new PR.

          Trivy found the following HIGH/CRITICAL dependency vulnerabilities:

          ${FINDINGS_SUMMARY}

          Instructions:
          1. Upgrade each affected dependency to the fixed version (or the nearest safe version) in the relevant service manifest (go.mod, build.gradle, Cargo.toml, pyproject.toml, package.json, Gemfile, *.csproj, build.sbt, requirements.txt).
          2. Do not touch services/report-service (excluded legacy service) and do not modify .trivyignore.
          3. Run each affected service's test suite to confirm nothing breaks.
          4. Commit and push to \`${BRANCH}\`. The pipeline will automatically re-scan on your push.

          This is remediation attempt $((ATTEMPT_COUNT + 1)) of ${MAX_FIX_ATTEMPTS}."

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg title "SAST auto-fix (Trivy): ${REPO} PR #${PR_NUM}" \
            '{prompt: $prompt, title: $title, tags: ["sast-auto-remediate", "trivy"]}')

          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${DEVIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" \
            "${DEVIN_API_BASE}/v3/organizations/${DEVIN_ORG_ID}/sessions")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '/^HTTP_STATUS:/d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | grep '^HTTP_STATUS:' | cut -d: -f2)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            SESSION_URL=$(echo "$HTTP_BODY" | jq -r '.url // empty')
            SESSION_ID=$(echo "$HTTP_BODY" | jq -r '.session_id // empty')
            if [ -z "$SESSION_URL" ] && [ -n "$SESSION_ID" ]; then
              SESSION_URL="${DEVIN_APP_URL}/sessions/${SESSION_ID#devin-}"
            fi
            echo "Devin session created (HTTP ${HTTP_CODE}): ${SESSION_URL}"

            {
              echo "## Devin SAST Auto-Fix Triggered (Trivy)"
              echo ""
              echo "A Devin session was created to remediate dependency vulnerabilities on \`${BRANCH}\`."
              if [ -n "$SESSION_URL" ]; then
                echo ""
                echo "**Session:** ${SESSION_URL}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            COMMENT="## Devin SAST Auto-Fix — Remediation In Progress (Trivy)

          Devin is remediating the HIGH/CRITICAL findings above and will push the fix directly to \`${BRANCH}\`. Trivy will re-scan automatically on the push."
            if [ -n "$SESSION_URL" ]; then
              COMMENT="${COMMENT}

          **Session:** ${SESSION_URL}"
            fi
            gh api "repos/${REPO}/issues/${PR_NUM}/comments" -f body="$COMMENT"
          else
            echo "::error::Failed to create Devin session (HTTP ${HTTP_CODE})"
            echo "$HTTP_BODY"
            exit 1
          fi

  escalate:
    needs: sast-scan
    if: |
      needs.sast-scan.outputs.has_findings == 'true' &&
      needs.sast-scan.outputs.exceeded_max == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open escalation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FINDINGS_SUMMARY: ${{ needs.sast-scan.outputs.findings_summary }}
          FIX_ATTEMPTS: ${{ env.MAX_FIX_ATTEMPTS }}
        run: |
          BODY="## Automated remediation exhausted

          Devin attempted **${FIX_ATTEMPTS}** fix cycles on
          PR #${PR_NUM} but HIGH/CRITICAL findings remain.

          ### Remaining findings

          ${FINDINGS_SUMMARY}

          ### Next steps

          - Review the findings manually
          - Check if the fixes require breaking API changes
          - Consider adding justified suppressions to .trivyignore
            with proper documentation

          _Opened automatically by the SAST auto-remediation pipeline._"

          gh api "repos/${REPO}/issues" \
            -f title="[Security] Unresolved SAST findings on PR #${PR_NUM}" \
            -f body="$BODY" \
            -f "labels[]=security" \
            -f "labels[]=needs-human-review"

      - name: Comment on PR about escalation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FIX_ATTEMPTS: ${{ env.MAX_FIX_ATTEMPTS }}
        run: |
          gh api \
            "repos/${REPO}/issues/${PR_NUM}/comments" \
            -f body=":rotating_light: **Escalation:** Automated remediation has been attempted ${FIX_ATTEMPTS} times without resolving all findings. A GitHub Issue has been opened for manual review."

  # ─────────────────────────────────────────────────────────────
  #  Path 2: SonarCloud quality gate (check_run trigger)
  # ─────────────────────────────────────────────────────────────

  sonarcloud-gate:
    name: SonarCloud Quality Gate Handler
    if: |
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'sonarqubecloud' &&
      github.event.check_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: sast-sonar-fix-${{ github.event.check_run.head_sha }}
      cancel-in-progress: true
    steps:
      - name: Resolve and validate PR
        id: pr_check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # check_run payloads only include pull_requests for same-repo PRs;
          # resolve via the commit → PRs association API to be robust.
          PR_JSON=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open" and .base.ref == "main")] | first // empty')

          if [ -z "$PR_JSON" ]; then
            echo "No open PR into main found for check_run head SHA ${HEAD_SHA}. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
          PR_BRANCH=$(echo "$PR_JSON" | jq -r '.head.ref')

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_branch=${PR_BRANCH}" >> "$GITHUB_OUTPUT"

          if [ "$PR_AUTHOR" = "devin-ai-integration[bot]" ]; then
            echo "PR #${PR_NUMBER} was authored by Devin. Skipping (bot-loop prevention)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One-time remediation: skip if Devin already attempted a fix.
          DEVIN_COMMENTS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("Devin SAST Auto-Fix — Remediation In Progress (SonarCloud)"))] | length')

          if [ "$DEVIN_COMMENTS" -gt 0 ]; then
            echo "Devin has already attempted a SonarCloud fix on PR #${PR_NUMBER}. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Create Devin remediation session (SonarCloud findings)
        if: steps.pr_check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          PR_NUMBER: ${{ steps.pr_check.outputs.pr_number }}
          PR_BRANCH: ${{ steps.pr_check.outputs.pr_branch }}
          REPO: ${{ github.repository }}
        run: |
          DASHBOARD="https://sonarcloud.io/dashboard?id=${SONAR_PROJECT_KEY}&pullRequest=${PR_NUMBER}"

          PROMPT="The SonarCloud quality gate failed on PR #${PR_NUMBER} of the repository ${REPO}.

          Check out the existing branch \`${PR_BRANCH}\` (the head branch of that PR) and push your fixes to that SAME branch. Do NOT open a new PR.

          SonarCloud dashboard for this PR: ${DASHBOARD}

          Instructions:
          1. Review the failed quality gate conditions on the dashboard (new bugs, vulnerabilities, security hotspots, code smells, coverage, duplication).
          2. Fix the code issues SonarCloud flagged on the new code in this PR. Prefer minimal, targeted fixes; follow each service's existing conventions in this polyglot monorepo.
          3. Do not suppress findings with // NOSONAR or rule exclusions; fix the underlying issues.
          4. Run the affected services' tests and linters to confirm nothing breaks.
          5. Commit and push to \`${PR_BRANCH}\`. SonarCloud will re-analyze automatically on the push.

          This is a ONE-TIME remediation attempt — if the gate still fails afterwards, humans will take over."

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg title "SAST auto-fix (SonarCloud): ${REPO} PR #${PR_NUMBER}" \
            '{prompt: $prompt, title: $title, tags: ["sast-auto-remediate", "sonarcloud"]}')

          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${DEVIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" \
            "${DEVIN_API_BASE}/v3/organizations/${DEVIN_ORG_ID}/sessions")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '/^HTTP_STATUS:/d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | grep '^HTTP_STATUS:' | cut -d: -f2)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            SESSION_URL=$(echo "$HTTP_BODY" | jq -r '.url // empty')
            SESSION_ID=$(echo "$HTTP_BODY" | jq -r '.session_id // empty')
            if [ -z "$SESSION_URL" ] && [ -n "$SESSION_ID" ]; then
              SESSION_URL="${DEVIN_APP_URL}/sessions/${SESSION_ID#devin-}"
            fi
            echo "Devin session created (HTTP ${HTTP_CODE}): ${SESSION_URL}"

            {
              echo "## Devin SAST Auto-Fix Triggered (SonarCloud)"
              echo ""
              echo "SonarCloud quality gate failed on PR #${PR_NUMBER}."
              if [ -n "$SESSION_URL" ]; then
                echo ""
                echo "**Session:** ${SESSION_URL}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            COMMENT="## Devin SAST Auto-Fix — Remediation In Progress (SonarCloud)

          SonarCloud quality gate failed on this PR. A Devin session has been created for a **one-time remediation attempt**.

          **[SonarCloud Dashboard](${DASHBOARD})**"
            if [ -n "$SESSION_URL" ]; then
              COMMENT="${COMMENT}

          **Session:** ${SESSION_URL}"
            fi
            COMMENT="${COMMENT}

          Devin will commit the fix directly to branch \`${PR_BRANCH}\`. SonarCloud will re-analyze once the fix is pushed."

            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$COMMENT"
          else
            echo "::error::Failed to create Devin session (HTTP ${HTTP_CODE})"
            echo "$HTTP_BODY"
            exit 1
          fi
