[package]
name = "file-service"
version = "0.1.0"
edition = "2021"
authors = ["OtterWorks Engineering"]

[dependencies]
actix-web = "4"
actix-multipart = "0.8"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = "0.32"
aws-config = "1.10"
aws-sdk-s3 = "1.141"
aws-sdk-dynamodb = "1.120"
aws-sdk-sns = "1.107"
aws-smithy-types = "1.6"
futures-util = "0.3"
bytes = "1"
mime = "0.3"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
prometheus = "0.14"
lazy_static = "1.5"
redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
actix-rt = "2"
actix-web = "4"
tokio = { version = "1", features = ["full", "test-util"] }
