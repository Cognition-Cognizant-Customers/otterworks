[package]
name = "file-service"
version = "0.1.0"
edition = "2021"
authors = ["OtterWorks Engineering"]

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = "0.14"
aws-config = "1.1"
aws-sdk-s3 = { version = "1.15", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.13", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.1"
futures-util = "0.3"
bytes = "1"
mime = "0.3"
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
prometheus = "0.13"
lazy_static = "1.4"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
actix-rt = "2"
actix-web = "4"
tokio = { version = "1", features = ["full", "test-util"] }
