# Operator-editable export banner templates (Commons Text interpolation).
# Read with java.util.Properties, not Spring, so ${...} tokens survive to the renderer.
banner.title=# OtterWorks Report: ${reportName}
banner.generated=# Generated: ${generated}
banner.period=# Period: ${periodFrom} to ${periodTo}
banner.rows=# Rows: ${rows}
banner.footer=# ${base64Decoder:R2VuZXJhdGVkIGJ5IE90dGVyV29ya3MgUmVwb3J0aW5n} | ${const:com.otterworks.report.service.ReportHeaderRenderer.CLASSIFICATION}
