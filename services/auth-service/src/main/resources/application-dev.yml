spring:
  jpa:
    show-sql: true
  flyway:
    # Local-development seed credential for admin@otterworks.dev; the dev profile is the
    # only place it is defaulted, and it is hashed by the migration, never stored in code.
    placeholders:
      seedAdminPassword: ${AUTH_SEED_ADMIN_PASSWORD:Admin123!}

logging:
  level:
    com.otterworks: DEBUG
    org.springframework.security: INFO
