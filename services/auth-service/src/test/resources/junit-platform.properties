# Randomize class and method execution order so the suite cannot develop ordering
# dependencies. The seed defaults to System.nanoTime() and is printed by JUnit at INFO,
# so every run exercises a different permutation.
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$Random
