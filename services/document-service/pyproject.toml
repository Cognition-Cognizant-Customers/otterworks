[tool.poetry]
name = "document-service"
version = "0.1.0"
description = "OtterWorks Document Service - Document CRUD, versioning, and content management"
authors = ["OtterWorks Engineering"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.52"}
asyncpg = "^0.31.0"
alembic = "^1.19.1"
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
structlog = "^26.1.0"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"
prometheus-fastapi-instrumentator = "^8.1.0"
python-multipart = ">=0.0.30,<0.1.0"
httpx = "^0.28.1"
boto3 = "^1.43.0"
PyJWT = "^2.13.0"
redis = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.16.2"
mypy = "^2.3.0"
httpx = "^0.28.1"
aiosqlite = "^0.22.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
